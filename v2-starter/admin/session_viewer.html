<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Earth Simulator — Session Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0f1a; color: #c8dff0; padding: 32px; }
    h1 { font-size: 20px; font-weight: 600; color: #4aa8e8; margin-bottom: 24px; }
    .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    input, button { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(80,160,220,0.2);
      background: rgba(8,20,32,0.9); color: #c8dff0; font-size: 13px; font-family: inherit; }
    button { cursor: pointer; background: rgba(74,168,232,0.15); }
    button:hover { background: rgba(74,168,232,0.25); }
    .session { background: rgba(8,20,32,0.7); border: 1px solid rgba(80,160,220,0.15);
      border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .session-header { font-size: 12px; color: #4aa8e8; margin-bottom: 12px; }
    .event-line { font-size: 12px; color: rgba(200,223,240,0.7); line-height: 1.8; padding-left: 12px; border-left: 2px solid rgba(80,160,220,0.2); }
    .event-line.chat_query { color: #7dd8a8; border-left-color: #7dd8a8; }
    .event-line.region_click { color: #f0c080; }
    .event-line.chapter_change { color: #a888e8; }
    .empty { color: rgba(200,223,240,0.3); font-size: 14px; margin-top: 40px; text-align: center; }
  </style>
</head>
<body>
  <h1>Session Viewer — Earth Simulator</h1>

  <div class="controls">
    <input id="supabase-url" type="text" placeholder="Supabase URL" style="width:280px" />
    <input id="supabase-key" type="text" placeholder="Service role key" style="width:320px" />
    <button id="load-btn">Load Sessions</button>
    <button id="export-btn">Export JSON</button>
  </div>

  <div id="sessions-container">
    <div class="empty">Enter your Supabase credentials and click Load Sessions.</div>
  </div>

  <script>
    let _rawData = [];

    document.getElementById('load-btn').addEventListener('click', loadSessions);
    document.getElementById('export-btn').addEventListener('click', () => {
      if (!_rawData.length) return;
      const blob = new Blob([JSON.stringify(_rawData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `telemetry_export_${Date.now()}.json`; a.click();
    });

    async function loadSessions() {
      const url = document.getElementById('supabase-url').value.trim();
      const key = document.getElementById('supabase-key').value.trim();
      if (!url || !key) { alert('Enter Supabase URL and service role key'); return; }

      const container = document.getElementById('sessions-container');
      container.innerHTML = '<div class="empty">Loading…</div>';

      try {
        const res = await fetch(`${url}/rest/v1/telemetry_events?order=timestamp.asc&limit=2000`, {
          headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        _rawData = await res.json();
        renderSessions(_rawData);
      } catch (err) {
        container.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
      }
    }

    function renderSessions(events) {
      const container = document.getElementById('sessions-container');
      if (!events.length) { container.innerHTML = '<div class="empty">No sessions found.</div>'; return; }

      // Group by sessionId
      const sessions = new Map();
      for (const ev of events) {
        if (!sessions.has(ev.sessionId)) sessions.set(ev.sessionId, []);
        sessions.get(ev.sessionId).push(ev);
      }

      container.innerHTML = '';

      for (const [sid, evs] of sessions) {
        const start = new Date(evs[0].timestamp);
        const end   = new Date(evs[evs.length-1].timestamp);
        const durationMin = Math.round((end - start) / 60000);

        const div = document.createElement('div');
        div.className = 'session';

        const queries = evs.filter(e => e.event === 'chat_query');
        const regions = [...new Set(evs.filter(e => e.event === 'region_click').map(e => e.payload.iso))];

        div.innerHTML = `
          <div class="session-header">
            Session ${sid.slice(-8)} — ${start.toLocaleString()} — ${durationMin}m
            &nbsp;·&nbsp; ${evs.length} events
            &nbsp;·&nbsp; ${queries.length} queries
            &nbsp;·&nbsp; Regions: ${regions.join(', ') || 'none'}
          </div>
          ${evs.map(ev => formatEvent(ev)).join('')}
        `;
        container.appendChild(div);
      }
    }

    function formatEvent(ev) {
      const t = new Date(ev.timestamp).toLocaleTimeString();
      let text = '';

      switch (ev.event) {
        case 'session_start':   text = `Started (${ev.payload.viewport})`; break;
        case 'chapter_change':  text = `→ Chapter ${ev.payload.year} (${ev.payload.ssp})`; break;
        case 'layer_change':    text = `→ Layer: ${ev.payload.layerId}`; break;
        case 'ssp_change':      text = `→ Pathway: ${ev.payload.ssp}`; break;
        case 'region_click':    text = `Clicked ${ev.payload.iso}`; break;
        case 'region_dwell':    text = `Dwelled on ${ev.payload.iso} for ${Math.round(ev.payload.durationMs/1000)}s`; break;
        case 'chat_query':      text = `💬 "${ev.payload.text}"`; break;
        case 'simulation_trigger': text = `⚡ Simulation: ${ev.payload.event} / ${ev.payload.iso} / ${ev.payload.year}`; break;
        case 'session_end':     text = `Session ended (${Math.round((ev.payload.durationMs||0)/60000)}m total)`; break;
        default: text = `${ev.event}: ${JSON.stringify(ev.payload).slice(0,60)}`;
      }

      return `<div class="event-line ${ev.event}">${t} &nbsp; ${text}</div>`;
    }
  </script>
</body>
</html>
